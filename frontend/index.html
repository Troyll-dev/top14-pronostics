<!DOCTYPE html>
<html lang="fr" data-theme="creme">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Top 14 Pronostics 2026-2027</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏉</text></svg>" />

    <!-- Installation sur l'écran d'accueil.

         iOS ignore le manifeste pour l'icône : il lui faut cette balise, et une
         image de 180 pixels sans transparence. Android, lui, se sert du
         manifeste et de ses icônes masquables.

         `apple-mobile-web-app-capable` fait disparaître la barre d'adresse une
         fois l'appli posée sur l'écran d'accueil — c'est elle qui transforme le
         site en application.

         La barre d'état est `black` et non `black-translucent`, et c'est une
         correction. Le mode translucide étend le contenu sous l'heure et la
         batterie : la barre de navigation du site s'y retrouvait cachée, et ne
         réapparaissait qu'en tirant la page vers le bas. Ce mode suppose que
         toute l'interface tienne compte des zones sûres de l'iPhone, ce qui
         n'est pas le cas ici — et ne vaut pas la peine de l'être pour gagner
         vingt pixels de décor.

         `black` donne une barre noire à texte blanc, lisible sur les deux
         thèmes, et le contenu commence proprement en dessous. `viewport-fit`
         reste à `cover` : il sert encore en bas, pour que le bandeau de mise à
         jour ne se glisse pas sous la barre de navigation du téléphone. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Top 14 Pronos" />
    <meta name="theme-color" content="#014224" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Applique le thème enregistré avant le premier rendu, pour éviter un clignotement -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('t14-theme');
          if (t === 'creme' || t === 'nuit') document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
