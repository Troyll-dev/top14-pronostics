version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: top14_db
    environment:
      POSTGRES_DB: top14_pronostics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: top14_backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/top14_pronostics
      JWT_SECRET: changez_ce_secret_en_production
      PORT: 3001
      FRONTEND_URL: http://localhost:5173
    ports:
      - '3001:3001'
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build: ./frontend
    container_name: top14_frontend
    depends_on:
      - backend
    ports:
      - '5173:80'

volumes:
  postgres_data:
